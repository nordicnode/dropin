name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      - name: Package
        run: |
          tag="${GITHUB_REF_NAME}"
          dir="dropin-${tag}-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/dropin" "$dir/"
          cp README.md LICENSE packaging/install.sh "$dir/"
          tar -czf "${dir}.tar.gz" "$dir"
          sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dropin-*.tar.gz
            dropin-*.tar.gz.sha256
          generate_release_notes: true
