[package]
name = "dropin-core"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
backhand = "0.25"
md4 = "0.10"
sha1 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
sequoia-openpgp = { version = "1", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# Pure-Rust archive handling: no external unzip/tar/7z needed.
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }
tar = { version = "0.4", default-features = false }
bzip2 = "0.4"
zstd = "0.13"
liblzma = "0.4"
